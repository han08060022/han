<style>

  html, body {
    width: 100%;

    display: flex;

    border-radius: 999px;

    backdrop-filter: blur(10px);

  .ctrl { display: flex; align-items: center; gap: 7px; }

  .ctrl label {

  .ctrl output {

  input[type=range] {

<body>

<canvas id="stage"></canvas>

<div id="hud">
  <div class="title">SIMPLE PENDULUM · 单摆简谐振动</div>
  <div class="row"><span class="k">摆角 θ</span><span class="v" id="o-theta">45.0°</span></div>
  <div class="row"><span class="k">角速度 ω</span><span class="v" id="o-omega">0.00</span></div>
  <div class="row"><span class="k">理论周期 T</span><span class="v" id="o-period">2.84s</span></div>
  <div class="row"><span class="k">完整周期</span><span class="v" id="o-count">0 个</span></div>
  <div class="row"><span class="k">阻尼模式</span><span class="v" id="o-mode">无阻尼</span></div>
</div>

<div id="panel">
  <div class="ctrl">
    <label>摆长 L</label>
    <input type="range" id="in-len" min="100" max="350" step="1" value="200">
    <output id="o-len">200</output>
  </div>

  <div class="ctrl">
    <label>重力 g</label>
    <input type="range" id="in-g" min="1" max="25" step="0.1" value="9.8">
    <output id="o-g">9.8</output>
  </div>

  <div class="ctrl">
    <label>阻尼 b</label>
    <input type="range" id="in-damp" min="0" max="0.010" step="0.0005" value="0">
    <output id="o-damp">0.000</output>
  </div>

  <div class="ctrl">
    <label>初摆角</label>
    <input type="range" id="in-ang" min="3" max="170" step="1" value="45">
    <output id="o-ang">45°</output>
  </div>

  <div class="divider"></div>

  <button id="btn-reset">重置摆动</button>
  <button id="btn-pause">暂停</button>
</div>

<div id="credit">
  李钰涵 · 7902126166<br>食品科学与工程
</div>

<script>
"use strict";

/* ============================================================
   单摆简谐振动模拟器
   ------------------------------------------------------------
   物理模型：d²θ/dt² = -(g/L)·sin(θ)
   数值积分：四阶龙格-库塔法（RK4），固定步长 + 时间累积器
   渲染：原生 HTML5 Canvas 2D
   ============================================================ */

/* -------------------- 1. 画布与自适应 -------------------- */
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);   // 限制 2 倍，避免高分屏掉帧
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);            // 逻辑坐标 = CSS 像素
}
window.addEventListener("resize", resize);
resize();

/* -------------------- 2. 物理状态 -------------------- */
const G_DEFAULT   = 9.8;
const L_DEFAULT   = 200;      // 像素
const ANG_DEFAULT = 45;       // 度

// 约束范围（与 HTML 滑块的 min/max 保持一致）
const L_MIN = 100, L_MAX = 350;
const G_MIN = 1,   G_MAX = 25;
const D_MIN = 0.0, D_MAX = 0.010;
const ANG_MIN = 3, ANG_MAX = 170;

// 把像素摆长换算成"米"，让 g 的数值有物理意义：
// 视 100px = 1m，则周期公式 T = 2π√(L_m/g) 可直接套用
const PX_PER_METER = 100;

// 阻尼标定系数：滑杆读数（0~0.010）乘以该系数得到实际物理阻尼 b_eff。
// 取 12 的目的是——滑到最右端时，约 4 个周期内振幅衰减近一半，
// 肉眼能清楚看到"越来越小、最后停下"的自然阻尼过程。
// （若直接用滑杆原值，衰减会慢到几乎看不出来。）
const DAMPING_GAIN = 12;

const sim = {
  Lpx:   L_DEFAULT,               // 摆长（像素）
  g:     G_DEFAULT,               // 重力加速度
  dampRead: 0.0,                  // 阻尼滑杆读数（0 ~ 0.010）
  damping: 0.0,                   // 实际物理阻尼 b_eff = dampRead × DAMPING_GAIN
  theta0: ANG_DEFAULT * Math.PI / 180,  // 初始摆角（弧度）
  theta: ANG_DEFAULT * Math.PI / 180,   // 当前摆角（弧度）
  omega: 0,                       // 角速度 (rad/s)
  time:  0,                       // 累计时间
  swings: 0,                      // 完成周期数
  paused: false,
  // 视觉用：轨迹残影
  trail: []
};

/* -------------------- 3. RK4 数值积分 -------------------- */
/**
 * 角加速度：含阻尼项
 *
 *   d²θ/dt² = -(g/L)·sin(θ) - b·ω
 *
 * 第一项是重力回复力（非线性，不做小角度近似）；
 * 第二项是阻尼力矩，与角速度成正比、方向相反——
 * 这就是真实空气阻力/轴承摩擦的简化模型，
 * b 越大衰减越快，b=0 时能量守恒、永不停止。
 *
 * @param theta 当前摆角（弧度）
 * @param omega 当前角速度（rad/s）
 * @param Lpx   摆长（像素，内部换算为米）
 * @param g     重力加速度
 * @param b     阻尼系数
 */
function accel(theta, omega, Lpx, g, b) {
  const Lm = Lpx / PX_PER_METER;   // 像素 → 米
  return -(g / Lm) * Math.sin(theta) - b * omega;
}

/**
 * 用 RK4 把状态推进 dt 秒。
 * 相比欧拉法，RK4 取四个斜率加权平均，能量漂移极小，
 * 长时间摆动不会"越摆越高"或"越摆越低"。
 */
function integrate(dt) {
  const { Lpx, g, damping: b } = sim;
  const t = sim.theta, w = sim.omega;

  const k1t = w,                          k1w = accel(t, w, Lpx, g, b);
  const k2t = w + 0.5 * dt * k1w,         k2w = accel(t + 0.5 * dt * k1t, w + 0.5 * dt * k1w, Lpx, g, b);
  const k3t = w + 0.5 * dt * k2w,         k3w = accel(t + 0.5 * dt * k2t, w + 0.5 * dt * k2w, Lpx, g, b);
  const k4t = w + dt * k3w,               k4w = accel(t + dt * k3t,       w + dt * k3w,       Lpx, g, b);

  // 阻尼下摆球最终会趋近静止，加上死区判定避免浮点抖动导致"永不停"
  sim.theta += (dt / 6) * (k1t + 2 * k2t + 2 * k3t + k4t);
  sim.omega += (dt / 6) * (k1w + 2 * k2w + 2 * k3w + k4w);
  sim.time  += dt;

  if (b > 0 && Math.abs(sim.omega) < 1e-6 && Math.abs(sim.theta) < 1e-6) {
    sim.omega = 0;
    sim.theta = 0;
  }
}

/* -------------------- 4. 几何计算 -------------------- */
// 悬点固定在画布上方中央偏上的位置
function pivot() {
  return { x: W / 2, y: Math.max(70, H * 0.14) };
}

// 摆长随窗口高度自适应缩放（不改变 sim.Lpx 的语义值）
function visualLength() {
  const p = pivot();
  const maxLen = Math.max(60, H - p.y - 110);   // 留出底部控制条空间
  const scale  = Math.min(1, maxLen / L_MAX);
  return sim.Lpx * scale;
}

function bobPosition() {
  const p = pivot();
  const L = visualLength();
  return {
    x: p.x + L * Math.sin(sim.theta),
    y: p.y + L * Math.cos(sim.theta)
  };
}

/* -------------------- 5. 绘制 -------------------- */
function drawBackground() {
  // 深灰科技底色
  ctx.fillStyle = "#1a1a24";
  ctx.fillRect(0, 0, W, H);

  // 中央径向辉光，让画面不至于死平
  const cx = W / 2, cy = H * 0.45;
  const r = Math.max(W, H) * 0.62;
  const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  halo.addColorStop(0,   "rgba(96,124,255,0.075)");
  halo.addColorStop(0.45,"rgba(96,124,255,0.028)");
  halo.addColorStop(1,   "rgba(26,26,36,0)");
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  // 网格（科技感辅助线）
  ctx.save();
  ctx.strokeStyle = "rgba(120,140,255,0.055)";
  ctx.lineWidth = 1;
  const gap = 46;
  ctx.beginPath();
  for (let x = (W / 2) % gap; x < W; x += gap) {
    ctx.moveTo(Math.round(x) + .5, 0);
    ctx.lineTo(Math.round(x) + .5, H);
  }
  for (let y = (H / 2) % gap; y < H; y += gap) {
    ctx.moveTo(0, Math.round(y) + .5);
    ctx.lineTo(W, Math.round(y) + .5);
  }
  ctx.stroke();
  ctx.restore();
}

function drawReference() {
  const p = pivot();
  const L = visualLength();

  // 竖直参考虚线（平衡位置）
  ctx.save();
  ctx.setLineDash([4, 9]);
  ctx.strokeStyle = "rgba(120,140,255,0.22)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x, p.y + L + 26);
  ctx.stroke();
  ctx.restore();

  // 角度扇形 + 摆角标注
  const ang = Math.abs(sim.theta);
  const R = Math.min(L * 0.42, 96);

  ctx.save();
  ctx.beginPath();
  const a0 = Math.PI / 2;                 // 竖直向下方向的起点
  const a1 = Math.PI / 2 - sim.theta;     // 摆杆方向
  ctx.arc(p.x, p.y, R, Math.min(a0, a1), Math.max(a0, a1));
  ctx.strokeStyle = "rgba(111,141,255,0.42)";
  ctx.lineWidth = 1.4;
  ctx.stroke();

  // 半透明扇形填充
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.arc(p.x, p.y, R, Math.min(a0, a1), Math.max(a0, a1));
  ctx.closePath();
  ctx.fillStyle = "rgba(111,141,255,0.055)";
  ctx.fill();

  // 角度文字
  const midA = (a0 + a1) / 2;
  const tx = p.x + (R + 22) * Math.cos(midA);
  const ty = p.y + (R + 22) * Math.sin(midA);
  ctx.fillStyle = "rgba(143,168,255,0.82)";
  ctx.font = "12px 'SF Mono', Consolas, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText((ang * 180 / Math.PI).toFixed(1) + "°", tx, ty);
  ctx.restore();
}

function drawTrail() {
  // 摆球轨迹残影：越旧越淡
  const n = sim.trail.length;
  if (n < 3) return;

  ctx.save();
  ctx.lineCap = "round";
  for (let i = 1; i < n; i++) {
    const a = sim.trail[i - 1], b = sim.trail[i];
    const t = i / n;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = "rgba(96,180,255," + (t * t * 0.5).toFixed(3) + ")";
    ctx.lineWidth = 1 + t * 2.2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawPendulum() {
  const p = pivot();
  const b = bobPosition();

  /* ---- 摆杆 ---- */
  ctx.save();
  const rod = ctx.createLinearGradient(p.x, p.y, b.x, b.y);
  rod.addColorStop(0, "rgba(150,170,255,0.85)");
  rod.addColorStop(1, "rgba(111,141,255,0.55)");
  ctx.strokeStyle = rod;
  ctx.lineWidth = 2.2;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
  ctx.restore();

  /* ---- 悬点轴心 ---- */
  ctx.save();
  ctx.shadowColor = "rgba(150,170,255,0.9)";
  ctx.shadowBlur = 14;
  ctx.fillStyle = "#9fb4ff";
  ctx.beginPath();
  ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = "rgba(120,140,255,0.35)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
  ctx.stroke();

  /* ---- 摆球（多层发光） ---- */
  const R = 17;
  // 摆动越快，辉光越强——把动能可视化为亮度
  // 有阻尼时振幅不断减小，辉光也随之自然变暗，让"能量耗散"看得见
  const energy = Math.min(1, Math.abs(sim.omega) / 6);
  const ampFactor = Math.min(1, Math.abs(sim.theta) / (ANG_DEFAULT * Math.PI / 180));
  const glow = 14 + energy * 30 + ampFactor * 8;
  const bright = 0.45 + 0.55 * Math.max(energy, ampFactor * 0.7);

  ctx.save();
  ctx.globalAlpha = bright;                 // 阻尼衰减时整体变暗
  ctx.shadowColor = "rgba(96,170,255,0.95)";
  ctx.shadowBlur = glow;

  // 外层柔光
  const outer = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R * 1.9);
  outer.addColorStop(0,   "rgba(120,190,255,0.30)");
  outer.addColorStop(0.5, "rgba(96,150,255,0.10)");
  outer.addColorStop(1,   "rgba(96,150,255,0)");
  ctx.fillStyle = outer;
  ctx.beginPath();
  ctx.arc(b.x, b.y, R * 1.9, 0, Math.PI * 2);
  ctx.fill();

  // 球体主体：左上受光的高光渐变
  const ball = ctx.createRadialGradient(
    b.x - R * 0.34, b.y - R * 0.34, R * 0.12,
    b.x, b.y, R
  );
  ball.addColorStop(0,    "#eaf4ff");
  ball.addColorStop(0.35, "#9ec6ff");
  ball.addColorStop(0.75, "#5a95ff");
  ball.addColorStop(1,    "#2f5fd0");
  ctx.fillStyle = ball;
  ctx.beginPath();
  ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 边缘高光圈
  ctx.strokeStyle = "rgba(200,225,255,0.55)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
  ctx.stroke();

  // 镜面高光点
  ctx.save();
  ctx.shadowColor = "rgba(255,255,255,0.95)";
  ctx.shadowBlur = 9;
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  ctx.beginPath();
  ctx.arc(b.x - R * 0.36, b.y - R * 0.38, R * 0.19, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function render() {
  drawBackground();
  drawReference();
  drawTrail();
  drawPendulum();
}

/* -------------------- 6. 主循环（requestAnimationFrame） -------------------- */
const FIXED_DT = 1 / 240;      // 固定物理步长，保证不同刷新率下行为一致
let accumulator = 0;
let lastTime = 0;

function loop(now) {
  requestAnimationFrame(loop);

  if (!lastTime) lastTime = now;
  let frameTime = (now - lastTime) / 1000;
  lastTime = now;

  // 标签页切回来时可能产生超大间隔，钳制掉，避免"瞬移"
  if (frameTime > 0.1) frameTime = 0.1;

  if (!sim.paused) {
    accumulator += frameTime;

    // 时间累积器：渲染帧率与物理步长解耦
    let guard = 0;
    while (accumulator >= FIXED_DT && guard < 600) {
      const prevTheta = sim.theta;
      integrate(FIXED_DT);
      countSwing(prevTheta, sim.theta);
      accumulator -= FIXED_DT;
      guard++;
    }

    // 记录轨迹残影
    const b = bobPosition();
    sim.trail.push({ x: b.x, y: b.y });
    if (sim.trail.length > 46) sim.trail.shift();

    updateHUD();
  }

  render();
}

// 周期计数：摆到达最高点时角速度 ω 过零变号。
// 从静止释放起，每 2 次 ω 符号翻转 = 恰好 1 个完整周期，
// 且对任意初始摆角（左/右侧释放）都精确成立，无相位偏移。
// （注意：不能用「θ 由正变负」计数——每周期只发生一次同向过零，
//   且第一次过零仅走了 1/4 周期，会产生 3T/4 的计数偏移。）
let lastOmega = null;
function countSwing(prevTheta, currTheta) {
  if (lastOmega !== null) {
    const flipped = (lastOmega < 0 && sim.omega >= 0) ||
                    (lastOmega > 0 && sim.omega <= 0);
    if (flipped) sim.swings = Math.floor(++omegaFlips / 2);
  }
  lastOmega = sim.omega;
}
let omegaFlips = 0;

/* -------------------- 7. HUD 刷新 -------------------- */
const elTheta  = document.getElementById("o-theta");
const elOmega  = document.getElementById("o-omega");
const elPeriod = document.getElementById("o-period");
const elCount  = document.getElementById("o-count");
const elMode   = document.getElementById("o-mode");

function theoryPeriod() {
  const Lm = sim.Lpx / PX_PER_METER;
  return 2 * Math.PI * Math.sqrt(Lm / sim.g);
}

function updateHUD() {
  elTheta.textContent = (sim.theta * 180 / Math.PI).toFixed(1) + "°";
  elOmega.textContent = sim.omega.toFixed(2);
  elPeriod.textContent = theoryPeriod().toFixed(2) + "s";
  elCount.textContent = sim.swings + " 个";

  // 阻尼状态提示（按滑杆读数分级）
  const dr = sim.dampRead;
  if (dr === 0) {
    elMode.textContent = "无阻尼";
    elMode.style.color = "#8fa8ff";
  } else if (dr < 0.003) {
    elMode.textContent = "弱阻尼";
    elMode.style.color = "#6fd0b0";
  } else if (dr < 0.007) {
    elMode.textContent = "中阻尼";
    elMode.style.color = "#e8c26a";
  } else {
    elMode.textContent = "强阻尼";
    elMode.style.color = "#e88a6a";
  }
}

/* -------------------- 8. 交互绑定 -------------------- */
const inLen  = document.getElementById("in-len");
const inG    = document.getElementById("in-g");
const inDamp = document.getElementById("in-damp");
const inAng  = document.getElementById("in-ang");
const oLen   = document.getElementById("o-len");
const oG     = document.getElementById("o-g");
const oDamp  = document.getElementById("o-damp");
const oAng   = document.getElementById("o-ang");
const btnReset = document.getElementById("btn-reset");
const btnPause = document.getElementById("btn-pause");

/**
 * 复位到初始状态。
 * @param {number} [thetaDeg] 指定初始摆角；省略则沿用「初摆角」滑块的值。
 *
 * 复位是"精准"的：摆角精确设为初始值、角速度清零、
 * 周期计数器与轨迹残影一并归零，且清空时间累积器，
 * 确保下一次物理推进从干净状态开始（不会残留旧帧的时间）。
 */
function resetMotion(thetaDeg) {
  const deg = (thetaDeg !== undefined) ? thetaDeg : Number(inAng.value);
  sim.theta = deg * Math.PI / 180;
  sim.omega = 0;
  sim.time  = 0;
  sim.swings = 0;
  omegaFlips = 0;
  lastOmega = null;
  sim.trail.length = 0;
  accumulator = 0;
  lastTime = 0;
  updateHUD();
}

/**
 * 重置按钮的处理器：精确回到 45° 初始状态，并同步 UI。
 *
 * 【作用域说明｜重要】
 * 本函数与 resetMotion 原先只存在于 <script> 的脚本作用域，
 * 只能被 addEventListener 的闭包引用。若将来有人把按钮改写成
 *   <button onclick="resetXxx()">
 * 这类内联写法，函数名会在「全局作用域」查找，脚本作用域里的函数
 * 找不到，就会抛出：
 *   Uncaught ReferenceError: resetXxx is not defined
 *     at HTMLButtonElement.onclick
 * 为消除这一隐患，下面把处理器显式挂到 window 上（见"全局挂载"一节），
 * 使内联绑定与 addEventListener 两种写法都能正常工作。
 */
function handleResetClick() {
  resetMotion(ANG_DEFAULT);      // 严格回到 45° 初始状态
  inAng.value = ANG_DEFAULT;
  oAng.textContent = ANG_DEFAULT + "°";
  sim.paused = false;
  btnPause.textContent = "暂停";
}

// --- 摆长：拖动即时生效，无需复位（改变的是几何，当前状态平滑过渡） ---
inLen.addEventListener("input", function () {
  sim.Lpx = Number(this.value);
  oLen.textContent = sim.Lpx;
  updateHUD();
});

// --- 重力：拖动即时生效，摆球当前的速度与位置都保留，物理响应连续 ---
inG.addEventListener("input", function () {
  sim.g = Number(this.value);
  oG.textContent = sim.g.toFixed(1);
  updateHUD();
});

// --- 阻尼：拖动即时生效，从当前状态开始自然衰减 ---
inDamp.addEventListener("input", function () {
  sim.dampRead = Number(this.value);
  sim.damping  = sim.dampRead * DAMPING_GAIN;   // 换算成物理阻尼
  oDamp.textContent = sim.dampRead.toFixed(3);
  updateHUD();
});

// --- 初摆角：拖动只更新标签，松手才复位释放 ---
inAng.addEventListener("input", function () {
  oAng.textContent = this.value + "°";
});

inAng.addEventListener("change", function () {
  resetMotion(Number(this.value));
});

// --- 重置摆动：精确回到初始状态（默认 45°） ---
btnReset.addEventListener("click", handleResetClick);

btnPause.addEventListener("click", function () {
  sim.paused = !sim.paused;
  btnPause.textContent = sim.paused ? "继续" : "暂停";
  if (!sim.paused) lastTime = 0;   // 恢复时重置时基，避免跳帧
});

// 键盘：空格暂停 / R 重置（顺手的小便利）
window.addEventListener("keydown", function (e) {
  if (e.code === "Space") {
    e.preventDefault();
    btnPause.click();
  } else if (e.key === "r" || e.key === "R") {
    btnReset.click();
  }
});

// 鼠标点击画布任意处：把该点方向设为新的起始摆角
canvas.addEventListener("click", function (e) {
  const p = pivot();
  const dx = e.clientX - p.x;
  const dy = e.clientY - p.y;
  if (dy <= 0) return;                       // 悬点上方忽略
  let deg = Math.atan2(dx, dy) * 180 / Math.PI;   // 相对竖直向下
  deg = Math.max(ANG_MIN, Math.min(ANG_MAX, Math.abs(deg)));
  inAng.value = Math.round(deg);
  oAng.textContent = Math.round(deg) + "°";
  resetMotion(deg);
});

/* -------------------- 9. 全局挂载（作用域兜底） --------------------
 *
 * 背景：脚本用 IIFE 包裹时，函数对外部（如内联 onclick）不可见；
 * 本项目虽未包裹 IIFE，但为彻底消除「函数作用域 ≠ 事件绑定作用域」
 * 这类 ReferenceError 隐患，这里把关键处理器显式挂到 window。
 *
 * 这样以下两种写法都能正常工作、且行为一致：
 *   A) btnReset.addEventListener("click", handleResetClick)   ← 当前用法
 *   B) <button onclick="handleResetClick()">                   ← 内联写法
 *
 * 同时为历史遗留的旧函数名 resetAnimation 提供别名，避免旧页面/旧缓存
 * 引用它时再次报错（自愈兼容）。
 */
window.handleResetClick = handleResetClick;
window.resetMotion      = resetMotion;
window.resetAnimation   = handleResetClick;   // 向后兼容别名
window.__pendulumReset  = handleResetClick;   // 控制台手工调试用

/* -------------------- 10. 启动 -------------------- */
// 同步 UI 与物理状态：滑块初值与 sim 保持一致
oLen.textContent  = sim.Lpx;
oG.textContent    = sim.g.toFixed(1);
oDamp.textContent = sim.dampRead.toFixed(3);

resetMotion(ANG_DEFAULT);
requestAnimationFrame(loop);

// 暴露给控制台，方便调试观察
window.__pendulum = sim;
</script>

</body>
</html>
